    <meta property="og:image" content="https://aimcontents.com/insight/og-insight.png">
    <meta property="og:site_name" content="아이엠콘텐츠">

    <script type="application/ld+json">
    {"@context":"https://schema.org","@type":"Blog","name":"아이엠콘텐츠 인사이트","description":"K-POP & 엔터테인먼트 산업 데이터 분석 블로그","url":"https://aimcontents.com/insight/","publisher":{"@type":"Organization","name":"아이엠콘텐츠","url":"https://aimcontents.com"}}
    </script>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
    <style>
        :root{--bg:#0b0b11;--bg2:#13131d;--card:#1a1a28;--card-h:#21212f;--text:#e4e4ea;--text2:#94949f;--text3:#5e5e6e;--ac:#6c5ce7;--ac2:#a29bfe;--ac-bg:rgba(108,92,231,.1);--bd:#28283a;--r:14px;--mw:860px;--t:.22s ease}
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;-webkit-font-smoothing:antialiased}
        a{color:inherit;text-decoration:none}
        .hd{position:sticky;top:0;z-index:50;background:rgba(11,11,17,.88);backdrop-filter:blur(16px);border-bottom:1px solid var(--bd)}
        .hd-in{max-width:1100px;margin:0 auto;padding:0 20px;height:54px;display:flex;align-items:center;justify-content:space-between}
        .logo{font-size:14px;font-weight:700;letter-spacing:.4px;display:flex;align-items:center;gap:7px}
        .logo-d{width:7px;height:7px;background:var(--ac);border-radius:50%}
        .nav{display:flex;gap:20px}
        .nav a{font-size:13px;color:var(--text2);font-weight:500;transition:color var(--t)}
        .nav a:hover,.nav a.on{color:var(--ac2)}
        .hero{max-width:var(--mw);margin:0 auto;padding:44px 20px 28px}
        .hero h1{font-size:26px;font-weight:800;letter-spacing:-.3px;margin-bottom:8px}
        .hero p{font-size:14px;color:var(--text2);max-width:480px;line-height:1.6}
        .fbar{max-width:var(--mw);margin:0 auto;padding:0 20px 20px;display:flex;gap:8px;flex-wrap:wrap}
        .fb{padding:6px 15px;border-radius:20px;border:1px solid var(--bd);background:transparent;color:var(--text2);font-size:12.5px;font-weight:500;cursor:pointer;transition:all var(--t);font-family:inherit}
        .fb:hover{border-color:var(--ac);color:var(--ac2)}
        .fb.on{background:var(--ac);border-color:var(--ac);color:#fff}
        .pl{max-width:var(--mw);margin:0 auto;padding:0 20px 60px;display:flex;flex-direction:column;gap:16px}
        .pc{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:24px 28px;transition:all var(--t);cursor:pointer}
        .pc:hover{background:var(--card-h);border-color:rgba(108,92,231,.3);transform:translateY(-2px)}
        .pm{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
        .pcat{font-size:11.5px;font-weight:600;color:var(--ac2);background:var(--ac-bg);padding:3px 10px;border-radius:12px}
        .pdt,.pvw{font-size:12px;color:var(--text3)}
        .pc h2{font-size:17px;font-weight:700;line-height:1.45;margin-bottom:8px;letter-spacing:-.2px}
        .pc .sum{font-size:13.5px;color:var(--text2);line-height:1.6;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .ptg{display:flex;gap:6px;flex-wrap:wrap}
        .ptg span{font-size:11.5px;color:var(--text3);padding:2px 8px;border-radius:10px;border:1px solid var(--bd)}
        .pgn{max-width:var(--mw);margin:0 auto;padding:0 20px 40px;display:flex;justify-content:center;gap:8px}
        .pgb{width:36px;height:36px;border-radius:8px;border:1px solid var(--bd);background:transparent;color:var(--text2);font-size:13px;font-weight:500;cursor:pointer;transition:all var(--t);font-family:inherit}
        .pgb:hover{border-color:var(--ac);color:var(--ac2)}
        .pgb.on{background:var(--ac);border-color:var(--ac);color:#fff}
        .ld,.emp{max-width:var(--mw);margin:0 auto;padding:60px 20px;text-align:center;color:var(--text3);font-size:14px}
        .sp{width:28px;height:28px;border:3px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 12px}
        @keyframes sp{to{transform:rotate(360deg)}}
        .ft{max-width:var(--mw);margin:0 auto;padding:30px 20px;text-align:center;border-top:1px solid var(--bd);font-size:12px;color:var(--text3)}
        .ft a{color:var(--ac2)}
        @media(max-width:600px){.hero h1{font-size:22px}.pc{padding:18px 20px}.pc h2{font-size:15.5px}.hd-in{padding:0 16px}.nav{gap:14px}}
    </style>
</head>
<body>
<header class="hd"><div class="hd-in">
    <a href="https://aimcontents.com/" class="logo"><span class="logo-d"></span>AIMCONTENTS</a>
    <nav class="nav"><a href="https://aimcontents.com/">홈</a><a href="/insight/" class="on">인사이트</a></nav>
</div></header>

<section class="hero"><h1>인사이트</h1><p>K-POP, 중국 SNS, 엔터테인먼트 산업에 대한 데이터 기반 전문 분석 칼럼</p></section>

<div class="fbar" id="fbar"><button class="fb on" data-c="all">전체</button></div>

<div class="ld" id="ld"><div class="sp"></div>글을 불러오는 중...</div>
<div class="pl" id="pl" style="display:none"></div>
<div class="emp" id="emp" style="display:none">아직 작성된 인사이트가 없습니다.</div>
<div class="pgn" id="pgn" style="display:none"></div>

<footer class="ft">&copy; 2026 <a href="https://aimcontents.com/">아이엠콘텐츠</a> · K-POP & 엔터 비즈니스 파트너</footer>

<script>
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// 📌 아래 URL을 실제 GAS 배포 URL로 교체
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const API = 'YOUR_GOOGLE_APPS_SCRIPT_DEPLOYMENT_URL';

const CATS = ['K-POP분석','중국시장','산업트렌드','재무분석','칼럼'];
let cat = 'all', pg = 1;
const LIM = 10;

document.addEventListener('DOMContentLoaded', () => { initFilters(); load(); });

function initFilters() {
    const bar = document.getElementById('fbar');
    CATS.forEach(c => {
        const b = document.createElement('button');
        b.className = 'fb'; b.dataset.c = c; b.textContent = c;
        b.onclick = () => { cat = c; pg = 1; setActive(); load(); };
        bar.appendChild(b);
    });
    bar.querySelector('[data-c="all"]').onclick = () => { cat = 'all'; pg = 1; setActive(); load(); };
}

function setActive() {
    document.querySelectorAll('.fb').forEach(b => b.classList.toggle('on', b.dataset.c === cat));
}

async function load() {
    const ld = document.getElementById('ld'), pl = document.getElementById('pl'),
          emp = document.getElementById('emp'), pgn = document.getElementById('pgn');
    ld.style.display = 'block'; pl.style.display = 'none'; emp.style.display = 'none'; pgn.style.display = 'none';

    try {
        let u = `${API}?action=list&page=${pg}&limit=${LIM}`;
        if (cat !== 'all') u += `&category=${encodeURIComponent(cat)}`;
        const r = await fetch(u);
        const d = await r.json();
        ld.style.display = 'none';
        if (!d.posts || !d.posts.length) { emp.style.display = 'block'; return; }
        pl.innerHTML = d.posts.map(p => `
            <article class="pc" onclick="location.href='/insight/post.html?slug=${enc(p.slug||p.id)}'">
                <div class="pm">
                    <span class="pcat">${esc(p.category)}</span>
                    <span class="pdt">${p.created_at}</span>
                    <span class="pvw">조회 ${p.view_count||0}</span>
                </div>
                <h2>${esc(p.title)}</h2>
                <p class="sum">${esc(p.summary)}</p>
                ${p.tags&&p.tags.length?`<div class="ptg">${p.tags.slice(0,4).map(t=>`<span>#${esc(t)}</span>`).join('')}</div>`:''}
            </article>`).join('');
        pl.style.display = 'flex';
        if (d.totalPages > 1) {
            pgn.innerHTML = Array.from({length:d.totalPages},(_,i)=>
                `<button class="pgb ${i+1===pg?'on':''}" onclick="pg=${i+1};load();scrollTo({top:0,behavior:'smooth'})">${i+1}</button>`).join('');
            pgn.style.display = 'flex';
        }
    } catch(e) { ld.style.display='none'; emp.style.display='block'; emp.textContent='로딩 실패. 잠시 후 다시 시도해주세요.'; }
}

function esc(s){return s?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}
function enc(s){return encodeURIComponent(s)}
</script>
</body>
</html>
