<footer class="article-footer">

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// 하이브리드 로딩: 정적 JSON 우선, API 폴백
// 조회수는 비동기 API로 별도 처리
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const JSON_URL = '/data/insight-posts.json'; // 정적 JSON 경로
const API = 'https://script.google.com/macros/s/AKfycby7Hw0e4CZmJnwWjHRsTVk0kEoktiDMjaOgWvLRauq_5pRF1D-nScDJ3vUWfcp5Re-A/exec'; // API 폴백 + 조회수용

// 페이지 로드 시 글 로드
document.addEventListener('DOMContentLoaded', loadPost);

/**
 * URL 파라미터에서 slug/id 추출 후 글 로드
 * 1차: 정적 JSON에서 검색 → 즉시 렌더링
 * 2차: JSON 실패 시 API 폴백
 * 조회수: 비동기 API 호출 (렌더링 차단 안 함)
 */
async function loadPost() {
    const params = new URLSearchParams(location.search);
    const slug = params.get('slug');
    const id = params.get('id');

    if (!slug && !id) {
        showError('잘못된 접근입니다.');
        return;
    }

    // 1차: 정적 JSON에서 글 검색
    try {
        const res = await fetch(JSON_URL);
        if (res.ok) {
            const data = await res.json();
            if (data.posts && data.posts.length) {
                // slug 또는 id로 해당 글 찾기
                const post = data.posts.find(p =>
                    (slug && p.slug === slug) || (id && String(p.id) === String(id))
                );
                if (post) {
                    renderPost(post); // 즉시 렌더링
                    incrementViewCount(slug, id); // 비동기 조회수 +1 (렌더링 차단 안 함)
                    return;
                }
            }
        }
    } catch (e) {
        console.log('정적 JSON 로드 실패, API 폴백:', e.message);
    }

    // 2차: GAS API 폴백 (action=view → 조회수 +1 포함)
    try {
        let url = `${API}?action=view`;
        if (slug) url += `&slug=${encodeURIComponent(slug)}`;
        else url += `&id=${encodeURIComponent(id)}`;

        const res = await fetch(url);
        const data = await res.json();

        if (data.error || !data.post) {
            showError('글을 찾을 수 없습니다.');
            return;
        }
        renderPost(data.post);
    } catch (e) {
        showError('데이터를 불러오지 못했습니다.');
        console.error(e);
    }
}

/**
 * 비동기 조회수 +1 (렌더링과 무관하게 백그라운드에서 실행)
 */
function incrementViewCount(slug, id) {
    let url = `${API}?action=view`;
    if (slug) url += `&slug=${encodeURIComponent(slug)}`;
    else url += `&id=${encodeURIComponent(id)}`;
    fetch(url).catch(() => {}); // 실패해도 무시 (조회수는 부가 기능)
}

/**
 * 글 렌더링 + SEO 메타 태그 동적 업데이트
 */
function renderPost(post) {
    // 메타 태그 업데이트
    document.title = `${post.title} | 아이엠콘텐츠 인사이트`;
    setMeta('description', post.summary);
    setOG('og:title', post.title);
    setOG('og:description', post.summary);
    setOG('og:url', location.href);
    if (post.thumbnail) setOG('og:image', post.thumbnail);

    // Schema.org BlogPosting 구조화 데이터
    const schema = document.createElement('script');
    schema.type = 'application/ld+json';
    schema.textContent = JSON.stringify({
        "@context": "https://schema.org",
        "@type": "BlogPosting",
        "headline": post.title,
        "description": post.summary,
        "datePublished": post.created_at,
        "dateModified": post.updated_at || post.created_at,
        "author": { "@type": "Person", "name": post.author || "아이엠콘텐츠" },
        "publisher": { "@type": "Organization", "name": "아이엠콘텐츠", "url": "https://aimcontents.com" },
        "url": location.href,
        "keywords": (post.seo_keywords || []).join(', ')
    });
    document.head.appendChild(schema);

    // 본문 HTML 렌더링
    const main = document.getElementById('main');
    main.innerHTML = `
        <a href="/insight/index_insight.html" class="back-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            목록으로
        </a>

        <span class="article-category">${esc(post.category)}</span>
        <h1 class="article-title">${esc(post.title)}</h1>
        <div class="article-meta">
            <span>${post.author || '아이엠콘텐츠'}</span>
            <span>${post.created_at}</span>
            <span>조회 ${post.view_count || 0}</span>
        </div>

        <div class="article-body">${post.content}</div>

        ${post.tags && post.tags.length ? `
        <div class="article-tags">
            ${post.tags.map(t => `<span>#${esc(t)}</span>`).join('')}
        </div>` : ''}

        <div class="share-bar">
            <button class="share-btn" onclick="copyLink()">🔗 링크 복사</button>
            <button class="share-btn" onclick="shareKakao()">💬 카카오톡</button>
        </div>

        <div class="cta-block">
            <p>K-POP 아이돌 SNS 순위, 중국 트렌드, 업계 채용정보까지 한곳에서 확인하세요.</p>
            <a href="https://aimcontents.com/" class="cta-btn">aimcontents.com 바로가기 →</a>
        </div>
    `;
}

/**
 * 에러 상태 표시
 */
function showError(msg) {
    document.getElementById('main').innerHTML = `
        <div style="text-align:center;padding:80px 20px">
            <p style="color:#999;font-size:15px;margin-bottom:20px">${msg}</p>
            <a href="/insight/index_insight.html" style="color:#0061f2;font-size:14px">← 인사이트 목록으로</a>
        </div>`;
}

/**
 * 링크 복사
 */
function copyLink() {
    navigator.clipboard.writeText(location.href).then(() => alert('링크가 복사되었습니다!'));
}

/**
 * 카카오톡 공유 (SDK 미설치 시 링크 복사로 대체)
 */
function shareKakao() {
    if (typeof Kakao !== 'undefined' && Kakao.isInitialized()) {
        Kakao.Share.sendDefault({
            objectType: 'feed',
            content: {
                title: document.title,
                description: document.querySelector('meta[name="description"]')?.content || '',
                imageUrl: document.querySelector('meta[property="og:image"]')?.content || '',
                link: { mobileWebUrl: location.href, webUrl: location.href }
            }
        });
    } else {
        copyLink();
    }
}

// 유틸리티 함수
function setMeta(name, content) {
    const el = document.querySelector(`meta[name="${name}"]`);
    if (el) el.content = content;
}
function setOG(prop, content) {
    const el = document.querySelector(`meta[property="${prop}"]`);
    if (el) el.content = content;
}
function esc(s) {
    return s ? s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;') : '';
}
</script>
<!-- NEW 뱃지 만료 자동 제거 -->
<script>
document.querySelectorAll('.nav-new-badge[data-expire]').forEach(function(el) {
    if (new Date() >= new Date(el.dataset.expire)) el.remove();
});
</script>
