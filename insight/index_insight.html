<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// 📌 아래 URL을 실제 GAS 배포 URL로 교체
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const API = 'https://script.google.com/macros/s/AKfycby7Hw0e4CZmJnwWjHRsTVk0kEoktiDMjaOgWvLRauq_5pRF1D-nScDJ3vUWfcp5Re-A/exec';

// 카테고리 목록
const CATS = ['K-POP분석', '중국시장', '산업트렌드', '재무분석', '칼럼'];
let currentCat = 'all'; // 현재 선택된 카테고리
let currentPage = 1;    // 현재 페이지
const PAGE_LIMIT = 10;  // 페이지당 글 수

// 페이지 로드 시 초기화
document.addEventListener('DOMContentLoaded', () => {
    initFilters();  // 카테고리 필터 버튼 생성
    loadPosts();    // 글 목록 로드
});

/**
 * 카테고리 필터 버튼 초기화
 */
function initFilters() {
    const bar = document.getElementById('filterBar');
    // 카테고리별 버튼 생성
    CATS.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.dataset.cat = cat;
        btn.textContent = cat;
        btn.onclick = () => {
            currentCat = cat;
            currentPage = 1;
            setActiveFilter();
            loadPosts();
        };
        bar.appendChild(btn);
    });
    // "전체" 버튼 클릭 핸들러
    bar.querySelector('[data-cat="all"]').onclick = () => {
        currentCat = 'all';
        currentPage = 1;
        setActiveFilter();
        loadPosts();
    };
}

/**
 * 활성 필터 버튼 스타일 업데이트
 */
function setActiveFilter() {
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.cat === currentCat);
    });
}

/**
 * GAS API에서 글 목록 로드
 */
async function loadPosts() {
    const loading = document.getElementById('loadingState');
    const list = document.getElementById('postList');
    const empty = document.getElementById('emptyState');
    const pagination = document.getElementById('pagination');

    // UI 상태 초기화
    loading.style.display = 'block';
    list.style.display = 'none';
    empty.style.display = 'none';
    pagination.style.display = 'none';

    try {
        // API URL 구성
        let url = `${API}?action=list&page=${currentPage}&limit=${PAGE_LIMIT}`;
        if (currentCat !== 'all') url += `&category=${encodeURIComponent(currentCat)}`;

        const res = await fetch(url);
        const data = await res.json();
        loading.style.display = 'none';

        // 글이 없으면 빈 상태 표시
        if (!data.posts || !data.posts.length) {
            empty.style.display = 'block';
            return;
        }

        // 글 카드 렌더링
        list.innerHTML = data.posts.map(post => `
            <a class="post-card" href="/insight/post.html?slug=${encodeURIComponent(post.slug || post.id)}">
                <div class="post-meta">
                    <span class="post-category">${esc(post.category)}</span>
                    <span class="post-date">${post.created_at}</span>
                    <span class="post-views">조회 ${post.view_count || 0}</span>
                </div>
                <h2>${esc(post.title)}</h2>
                <p class="post-summary">${esc(post.summary)}</p>
                ${post.tags && post.tags.length
                    ? `<div class="post-tags">${post.tags.slice(0, 4).map(t => `<span class="post-tag">#${esc(t)}</span>`).join('')}</div>`
                    : ''}
            </a>
        `).join('');
        list.style.display = 'block';

        // 페이지네이션 렌더링
        if (data.totalPages > 1) {
            pagination.innerHTML = Array.from({ length: data.totalPages }, (_, i) =>
                `<button class="page-btn ${i + 1 === currentPage ? 'active' : ''}"
                    onclick="currentPage=${i + 1}; loadPosts(); scrollTo({top:0,behavior:'smooth'})">${i + 1}</button>`
            ).join('');
            pagination.style.display = 'flex';
        }
    } catch (e) {
        loading.style.display = 'none';
        empty.style.display = 'block';
        empty.textContent = '로딩 실패. 잠시 후 다시 시도해주세요.';
    }
}

/**
 * HTML 이스케이프 (XSS 방지)
 */
function esc(s) {
    return s ? s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;') : '';
}
</script>
